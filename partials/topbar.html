<div class="glass-pill rounded-2xl p-3 flex flex-col gap-2.5 text-xs font-medium text-white max-w-full overflow-x-auto">
  <div class="flex items-center gap-3 pb-1 border-b border-white/10 justify-between flex-wrap sm:flex-nowrap">
    <div class="flex items-center gap-2 shrink-0">
      <div class="w-7 h-7 rounded-full bg-amber-100/20 border border-white/40 flex items-center justify-center text-amber-200">
        <i data-lucide="user" class="w-3.5 h-3.5"></i>
      </div>
      <div>
        <span id="charNameDisplay" class="font-bold text-white text-xs block leading-none">Pemain</span>
        <span id="charMetaDisplay" class="text-[9px] text-stone-300">—</span>
      </div>
    </div>

    <div class="flex items-center gap-2.5 text-[11px] font-semibold text-white shrink-0 ml-auto bg-black/30 px-2.5 py-1 rounded-xl border border-white/10">
      <div class="flex items-center gap-1 text-emerald-400">
        <i data-lucide="wallet" class="w-3.5 h-3.5"></i>
        <span id="statUangVal" class="font-extrabold">Rp 0</span>
      </div>
      <div class="h-3 w-px bg-white/20"></div>
      <div class="flex items-center gap-1 text-sky-300">
        <i id="weatherBadgeIcon" data-lucide="sun" class="w-3.5 h-3.5 text-amber-300"></i>
        <span id="weatherBadgeText" class="font-bold">—</span>
      </div>
      <div class="h-3 w-px bg-white/20"></div>
      <div class="flex items-center gap-1 text-amber-300">
        <i data-lucide="calendar" class="w-3.5 h-3.5"></i>
        <span id="simTimeDisplay" class="font-serif font-extrabold tracking-wider text-xs">—</span>
      </div>
    </div>
  </div>

  <div id="statRingsContainer" class="flex items-center justify-between gap-1 overflow-x-auto py-1"></div>
</div>

<div class="glass-pill-transparent rounded-2xl p-3 flex flex-col w-full overflow-hidden transition-all duration-300 relative" style="height: calc(100vh - 300px); max-height: calc(100vh - 300px);">
  <div class="w-full flex items-center justify-between pb-2 mb-2 border-b border-white/15 shrink-0">
    <div class="flex items-center gap-2">
      <div class="p-1 rounded-md bg-amber-400/20 text-amber-300 border border-amber-300/30">
        <i data-lucide="scroll-text" class="w-3.5 h-3.5"></i>
      </div>
      <span id="currentLocDisplayBadge" class="text-[10px] font-bold text-amber-200 flex items-center gap-1.5 bg-black/50 px-2.5 py-1 rounded-lg border border-amber-300/30 shadow-inner">
        <i data-lucide="map-pin" class="w-3 h-3 text-amber-300"></i>
        <span id="currentLocNameText">—</span>
      </span>
    </div>
    <button id="btnClearLogs" title="Bersihkan Catatan Jurnal" class="text-[10px] text-stone-300 hover:text-white bg-white/10 hover:bg-white/25 px-2.5 py-1 rounded-lg border border-white/15 transition-all flex items-center gap-1 cursor-pointer">
      <i data-lucide="trash-2" class="w-3 h-3"></i>
      <span>Bersihkan Log</span>
    </button>
  </div>
  <div id="journalStack" class="flex flex-col gap-1.5 overflow-y-auto pr-1 flex-1 blur-bottom-mask"></div>
</div>
